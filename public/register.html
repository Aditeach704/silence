<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create your account | Silence Nodes</title><link rel="stylesheet" href="/auth.css"></head><body><main class="auth"><div class="brand"><span class="mark">S</span>Silence Nodes</div><h1>Create your account</h1><p>Register once, then sign in to access the client website.</p><form method="post" action="/register"><label>Full name</label><input name="name" required autocomplete="name" placeholder="Your name"><label>Email address</label><input name="email" type="email" required autocomplete="email" placeholder="you@example.com"><label>Password</label><input name="password" type="password" required minlength="8" autocomplete="new-password" placeholder="At least 8 characters"><button>Create account →</button></form><p class="hint">Already registered? <a href="/login">Sign in</a></p></main></body></html>
